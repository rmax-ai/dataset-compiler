[project]
name = "dataset-compiler"
version = "0.0.1"
description = "Declarative purpose-specific dataset compilation: DatasetSpec -> frozen BuildManifest."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rmax-ai" }]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.scripts]
dataset-compiler = "dataset_compiler.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_compiler"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
